# pnpm blocks dependency postinstall scripts by default.
# These trusted packages ship native binaries and are allowed to build.
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  # Local Postgres binaries for dev/tests (embedded-postgres).
  "@embedded-postgres/windows-x64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
